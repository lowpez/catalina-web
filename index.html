<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DATALINA WEB | Sintetizador Gráfico</title>
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

    <h1>DATALINA <span>WEB</span></h1>
    <p class="subtitle">Sintetizador Gráfico por Escaneo Raster | Homenaje a Catalina & ANS</p>

    <div class="studio-container">
        <div class="canvas-wrapper" id="canvasWrapper">
            <div class="playhead" id="playhead"></div>
            <canvas id="visualizer" width="800" height="400"></canvas>
        </div>

        <div class="controls">
            <div class="control-group">
                <div class="file-input-wrapper">
                    <div class="file-input-btn">📁 Cargar Dibujo (JPG/PNG)</div>
                    <input type="file" id="imageInput" accept="image/*">
                </div>
            </div>

            <div class="control-group">
                <button id="btnPlay" disabled>▶ INICIAR AUDIO</button>
                <button id="btnStop" class="secondary" disabled>⏹ DETENER</button>
            </div>

            <div class="control-group">
                <label>Velocidad de Escaneo <span class="value-display" id="valSpeed">2.0s</span></label>
                <input type="range" id="paramSpeed" min="0.5" max="10" step="0.1" value="2.0">
            </div>

            <div class="control-group">
                <label>Frecuencia Base <span class="value-display" id="valFreq">C3</span></label>
                <input type="range" id="paramFreq" min="0" max="4" step="1" value="0">
            </div>

            <div class="control-group">
                <label>Filtro (Brillo → Cutoff) <span class="value-display" id="valFilter">50%</span></label>
                <input type="range" id="paramFilter" min="0" max="100" step="1" value="50">
            </div>

            <div class="control-group" style="margin-top: auto;">
                <button id="btnExport" class="secondary" disabled>💾 EXPORTAR A WAV</button>
            </div>
            
            <div class="status" id="statusText">Esperando imagen...</div>
        </div>
    </div>

    <script src="assets/js/script.js"></script>
</body>
</html>
