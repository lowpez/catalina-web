<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalina Web | Sintetizador Gráfico</title>
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link href="https://fonts.googleapis.com/css2?family=Karla:wght@400;500;700;800&family=Poppins:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
	<nav class="top-nav" aria-label="Navegación principal">
        <div class="nav-content">
            <div class="nav-brand">
                <p class="nav-subtitle">Sintetizador Gráfico por Escaneo Raster | Homenaje a von Reichenbach</p>
            </div>
            <!-- Espacio reservado para enlaces futuros -->
            <div class="nav-links">
                <!-- <a href="ejemplos.html">Ejemplos</a> -->
                <!-- <a href="https://github.com/lowpez/catalina-web">GitHub</a> -->
            </div>
        </div>
    </nav>

	<header class="app-header">
        <div class="status-indicator" id="statusIndicator"></div>
        <span id="statusText">Sistema listo. Esperando imagen...</span>
    </header>

    <div class="studio-container">
        <div class="canvas-wrapper" id="canvasWrapper">
            <div class="playhead" id="playhead"></div>
            <canvas id="visualizer" width="800" height="400"></canvas>
        </div>

        <aside class="controls">
            <!-- SECCIÓN 1: MODOS DE ESCANEO -->
            <div class="control-section">
                <label class="section-label">Modos de Escaneo</label>
                <div class="toggles-container">
                    <label class="toggle-label" title="Actívalo si tu dibujo tiene líneas negras sobre fondo blanco">
                        <input type="checkbox" id="toggleInvert" checked>
                        <span class="toggle-text">Trazo = Sonido</span>
                    </label>
                    <label class="toggle-label">
                        <input type="checkbox" id="toggleLoop" checked>
                        <span class="toggle-text">Loop</span>
                    </label>
					<label class="toggle-label">
						<input type="checkbox" id="togglePingPong">
						<span class="toggle-text">Ping-Pong</span>
					</label>
                    <label class="toggle-label">
                        <input type="checkbox" id="toggleRND">
                        <span class="toggle-text">RANDOM</span>
                    </label>
                </div>
            </div>

            <!-- SECCIÓN 2: CONTROLES PRINCIPALES -->
            <div class="control-group">
                <div class="file-input-wrapper">
                    <div class="file-input-btn">📁 Cargar Dibujo (JPG/PNG)</div>
                    <input type="file" id="imageInput" accept="image/*">
                </div>
            </div>

            <div class="control-group">
                <button id="btnPlay" disabled>▶ Iniciar Audio</button>
                <button id="btnStop" class="secondary" disabled>⏹ Detener</button>
            </div>

            <div class="control-group">
                <label>Velocidad de Escaneo <span class="value-display" id="valSpeed">2.0s</span></label>
                <input type="range" id="paramSpeed" min="0.5" max="10" step="0.1" value="2.0">
            </div>
			<div class="control-group">
                <label>Posición Manual (Scrub) <span class="value-display" id="valScrub">0%</span></label>
                <input type="range" id="paramScrub" min="0" max="100" step="0.1" value="0">
            </div>

            <!-- SECCIÓN 3: RANGO DE FRECUENCIAS (CON MODO) -->
            <div class="control-section">
                <div class="section-header">
                    <label class="section-label">Rango de Frecuencias</label>
                    
                    <!-- NUEVO: Switch de Modo -->
                    <div class="mode-switch">
                        <button id="btnModeMusical" class="mode-btn active">MUSICAL</button>
                        <button id="btnModeSpectral" class="mode-btn">ESPECTRAL</button>
                    </div>
                </div>
                
                <!-- Contenedor de Nota Raíz (Solo visible en modo Musical) -->
                <div id="rootNoteContainer" class="control-group">
                    <label>Nota Raíz (Tonalidad)</label>
                    <select id="selectRootNote" class="note-select">
                        <option value="65.41">C2 (Grave)</option>
                        <option value="130.81" selected>C3 (Medio-Grave)</option>
                        <option value="261.63">C4 (Medio)</option>
                        <option value="523.25">C5 (Agudo)</option>
                        <option value="1046.50">C6 (Muy Agudo)</option>
                    </select>
                </div>

                <div class="control-group">
                    <label>Mín (Límite Inf) <span class="value-display" id="valFreqMin">65 Hz</span></label>
                    <input type="range" id="paramFreqMin" min="20" max="1000" step="1" value="65">
                </div>
                <div class="control-group">
                    <label>Máx (Límite Sup) <span class="value-display" id="valFreqMax">523 Hz</span></label>
                    <input type="range" id="paramFreqMax" min="200" max="8000" step="1" value="523">
                </div>
            </div>

            <!-- SECCIÓN 4: PROCESAMIENTO Y SALIDA -->
            <div class="control-group">
                <label>Filtro (Brillo → Cutoff) <span class="value-display" id="valFilter">50%</span></label>
                <input type="range" id="paramFilter" min="0" max="100" step="1" value="50">
            </div>

            <div class="control-group">
                <label>Volumen Master <span class="value-display" id="valVol">80%</span></label>
                <input type="range" id="paramVol" min="0" max="100" step="1" value="80">
            </div>

            <div class="control-group" style="margin-top: auto;">
                <button id="btnExport" class="secondary" disabled>💾 Exportar a WAV</button>
            </div>
            
        </aside>
    </div>

    <script src="assets/js/script.js"></script>
</body>
</html>
