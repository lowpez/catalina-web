<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalina Web | Sintetizador Gráfico</title>
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link href="https://fonts.googleapis.com/css2?family=Karla:wght@400;500;700;800&family=Poppins:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
	<nav class="top-nav" aria-label="Navegación principal">
        <div class="nav-content">
            <div class="nav-brand">
                <p class="nav-subtitle">Sintetizador Gráfico por Escaneo Raster | Homenaje a von Reichenbach</p>
            </div>
            <!-- Espacio reservado para enlaces futuros -->
            <div class="nav-links">
                <!-- <a href="ejemplos.html">Ejemplos</a> -->
                <!-- <a href="https://github.com/lowpez/catalina-web">GitHub</a> -->
            </div>
        </div>
    </nav>

	<header class="app-header">
        <div class="status-indicator" id="statusIndicator"></div>
        <span id="statusText">Sistema listo. Esperando imagen...</span>
    </header>

    <div class="studio-container">
        <div class="canvas-wrapper" id="canvasWrapper">
            <div class="playhead" id="playhead"></div>
            <canvas id="visualizer" width="800" height="400"></canvas>
			<!-- Botón Fullscreen -->
			<button id="btnFullscreen" class="fullscreen-btn" title="Pantalla completa">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
        </svg>
    </button>
        </div>

        <aside class="controls">
            <!-- SECCIÓN 1: MODOS DE ESCANEO -->
            <div class="control-section">
                <label class="section-label">Modos de Escaneo</label>
                <div class="toggles-container">
                    <label class="toggle-label" title="Actívalo si tu dibujo tiene líneas negras sobre fondo blanco">
                        <input type="checkbox" id="toggleInvert" checked>
                        <span class="toggle-text">Trazo = Sonido</span>
                    </label>
                    <label class="toggle-label">
                        <input type="checkbox" id="toggleLoop" checked>
                        <span class="toggle-text">Loop</span>
                    </label>
					<label class="toggle-label">
						<input type="checkbox" id="togglePingPong" checked>
						<span class="toggle-text">Ping-Pong</span>
					</label>
                    <label class="toggle-label">
                        <input type="checkbox" id="toggleRND">
                        <span class="toggle-text">RANDOM</span>
                    </label>
                </div>
				<!-- NUEVO: Controles Generativos (Divulgación Progresiva) -->
                <div class="generative-controls" id="generativeControls">
                    <div class="control-group">
                        <label>Entropía <span class="value-display" id="valEntropy">50%</span></label>
                        <input type="range" id="paramEntropy" min="0" max="100" step="1" value="50">
                        <div class="entropy-labels">
                            <span class="entropy-label-left">Suave</span>
                            <span class="entropy-label-right">Caótico</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- SECCIÓN 2: CONTROLES PRINCIPALES -->
            <div class="control-group">
                <div class="file-input-wrapper">
                    <div class="file-input-btn">📁 Cargar Dibujo (JPG/PNG)</div>
                    <input type="file" id="imageInput" accept="image/*">
                </div>
            </div>
	
			<div class="control-group">
				<button id="btnPlay" class="btn-primary" disabled>▶ Iniciar Audio</button>
				
				<div class="button-row">
					<button id="btnStop" class="secondary" disabled>⏹ Detener</button>
					<button id="btnReset" class="secondary">↺ Reset</button>
				</div>
			</div>

            <div class="control-group">
                <label>Velocidad de Escaneo <span class="value-display" id="valSpeed">2.0s</span></label>
                <input type="range" id="paramSpeed" min="0.5" max="10" step="0.1" value="2.0">
            </div>
			<div class="control-group">
                <label>Posición Manual (Scrub) <span class="value-display" id="valScrub">0%</span></label>
                <input type="range" id="paramScrub" min="0" max="100" step="0.1" value="0">
            </div>

            <!-- SECCIÓN 3: RANGO DE FRECUENCIAS (CON MODO) -->
            <div class="control-section">
                <div class="section-header">
                    <label class="section-label">Rango de Frecuencias</label>
                    
                    <!-- NUEVO: Switch de Modo -->
                    <div class="mode-switch">
                        <button id="btnModeMusical" class="mode-btn active">MUSICAL</button>
                        <button id="btnModeSpectral" class="mode-btn">ESPECTRAL</button>
                    </div>
                </div>
                
                <!-- Contenedor de Nota Raíz (Solo visible en modo Musical) -->
                <div id="rootNoteContainer" class="control-group">
                    <label>Nota Raíz (Tonalidad)</label>
                    <select id="selectRootNote" class="note-select">
                        <!-- OCTAVA 2: GRAVE -->
                        <option value="65.41">C2 (Do - Grave)</option>
                        <option value="73.42">D2 (Re - Grave)</option>
                        <option value="82.41">E2 (Mi - Grave)</option>
                        <option value="87.31">F2 (Fa - Grave)</option>
                        <option value="98.00">G2 (Sol - Grave)</option>
                        <option value="110.00">A2 (La - Grave)</option>
                        <option value="123.47">B2 (Si - Grave)</option>
                        
                        <!-- OCTAVA 3: MEDIO-GRAVE -->
                        <option value="130.81" selected>C3 (Do - Medio-Grave)</option>
                        <option value="146.83">D3 (Re - Medio-Grave)</option>
                        <option value="164.81">E3 (Mi - Medio-Grave)</option>
                        <option value="174.61">F3 (Fa - Medio-Grave)</option>
                        <option value="196.00">G3 (Sol - Medio-Grave)</option>
                        <option value="220.00">A3 (La - Medio-Grave)</option>
                        <option value="246.94">B3 (Si - Medio-Grave)</option>
                        
                        <!-- OCTAVA 4: MEDIO -->
                        <option value="261.63">C4 (Do - Medio)</option>
                        <option value="293.66">D4 (Re - Medio)</option>
                        <option value="329.63">E4 (Mi - Medio)</option>
                        <option value="349.23">F4 (Fa - Medio)</option>
                        <option value="392.00">G4 (Sol - Medio)</option>
                        <option value="440.00">A4 (La - Medio)</option>
                        <option value="493.88">B4 (Si - Medio)</option>
                        
                        <!-- OCTAVA 5: AGUDO -->
                        <option value="523.25">C5 (Do - Agudo)</option>
                    </select>
                </div>
				
				<div class="control-group">
					<label>Textura Armónica</label>
					<select id="selectVoicing" class="note-select">
						<option value="chord-melody" selected>Chord-Melody (Acordes)</option>
						<option value="voice-pair">Voice-Pair (Dúos)</option>
						<option value="drone">Drone (Pedal)</option>
						<option value="open">Open Voicing (Abierto)</option>
					</select>
				</div>
				
				<div class="control-group" id="scaleContainer">
					<label>Modo Armónico (Escala)</label>
					<select id="selectScale" class="note-select">
						<option value="lydian" selected>Lydian (Mágico/Etéreo)</option>
						<option value="major">Mayor (Alegre/Clásico)</option>
						<option value="minor">Menor (Melancólico/Dramático)</option>
						<option value="pentatonic">Pentatónico (Folk/Universal)</option>
						<option value="pentatonicMinor">Pentatónico Menor (Blues/Soul)</option>
					</select>
				</div>

                <div class="control-group">
                    <label>Mín (Límite Inf) <span class="value-display" id="valFreqMin">65 Hz</span></label>
                    <input type="range" id="paramFreqMin" min="20" max="1000" step="1" value="65">
                </div>
                <div class="control-group">
                    <label>Máx (Límite Sup) <span class="value-display" id="valFreqMax">523 Hz</span></label>
                    <input type="range" id="paramFreqMax" min="200" max="8000" step="1" value="523">
                </div>
            </div>

            <!-- SECCIÓN 4: PROCESAMIENTO Y SALIDA -->
            <div class="control-group">
                <label>Color Tímbrico <span class="value-display" id="valFilter">50%</span></label>
                
                <div class="filter-control-row">
                    <!-- Icono Izquierdo: Profundo / Oscuro / Submarino -->
                    <svg class="filter-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"></path>
                    </svg>
                    
                    <input type="range" id="paramFilter" min="0" max="100" step="1" value="50">
                    
                    <!-- Icono Derecho: Brillante / Cristalino / Etéreo -->
                    <svg class="filter-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
                    </svg>
                </div>
            </div>

            <div class="control-group">
                <label>Volumen Master <span class="value-display" id="valVol">80%</span></label>
                <input type="range" id="paramVol" min="0" max="100" step="1" value="80">
            </div>
			
			<div class="control-group">
                <label>Duración del audio final <span class="value-display" id="valExportDuration">60s</span></label>
				<input type="number" id="paramExportDuration" min="1" max="300" step="1" value="60">
				<div class="export-info">
					<span class="export-info-text">Escribe un valor entre 1 y 300</span>
				</div>
            </div>

            <div class="control-group" style="margin-top: auto;">
                <button id="btnExport" class="secondary" disabled>💾 Exportar a WAV</button>
            </div>
            
        </aside>
    </div>
	<script src="https://cdn.jsdelivr.net/npm/tone@latest/build/Tone.min.js"></script>
    <script src="assets/js/script.js"></script>
</body>
</html>
